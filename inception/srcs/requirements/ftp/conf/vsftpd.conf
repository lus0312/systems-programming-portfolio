# Listen for FTP connections over IPv4
listen=YES
listen_ipv6=NO

# Disable anonymous access; allow local Linux users
anonymous_enable=NO
local_enable=YES

# Allow authenticated users to modify files
write_enable=YES

# Keep FTP users inside their FTP root directory
chroot_local_user=YES
allow_writeable_chroot=YES

# Expose the WordPress files as the FTP root
local_root=/var/www/wordpress

# Passive-mode ports used for FTP data connections
pasv_enable=YES
pasv_min_port=21100
pasv_max_port=21110

seccomp_sandbox=NO
