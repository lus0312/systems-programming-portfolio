server {
    # HTTPS is the only web entry point
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name eulee.42.fr;

    # Serve files from the shared WordPress volume
    root /var/www/wordpress;
    index index.php;

    # Allow only the TLS versions required by the project
    ssl_protocols TLSv1.2 TLSv1.3;

    ssl_certificate     /etc/nginx/ssl/inception.crt;
    ssl_certificate_key /etc/nginx/ssl/inception.key;

    # Serve existing files or forward the request to WordPress
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Forward PHP scripts to PHP-FPM in the WordPress container
    location ~ \.php$ {
        include fastcgi_params;

        fastcgi_pass wordpress:9000;

        # Tell PHP-FPM which script file should be executed
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
