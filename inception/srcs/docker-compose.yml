services:
  mariadb:
    build:
      context: ./requirements/mariadb
    image: mariadb:bookworm
    container_name: mariadb

    # Restart the service when the main process exits with an error
    restart: on-failure

    # Non-sensitive database settings are provided through .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}

    # Database password is provided separately as a Docker secret
    secrets:
      - db_password

    # Persist the WordPress database outside the container filesystem
    volumes:
      - mariadb_data:/var/lib/mysql

    # Allow communication with the other Inception services
    networks:
      - inception


  wordpress:
    build:
      context: ./requirements/wordpress
    image: wordpress:bookworm
    container_name: wordpress
    restart: on-failure

    # WordPress and database configuration loaded from .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      DOMAIN_NAME: ${DOMAIN_NAME}
      WP_TITLE: ${WP_TITLE}
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
      WP_USER: ${WP_USER}
      WP_USER_EMAIL: ${WP_USER_EMAIL}

    # Passwords are kept outside the image and environment file
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password

    # Store WordPress files in a persistent shared volume
    volumes:
      - wordpress_data:/var/www/wordpress

    networks:
      - inception


  nginx:
    build:
      context: ./requirements/nginx
    image: nginx:bookworm
    container_name: nginx
    restart: on-failure

    # NGINX is the only public entry point of the mandatory infrastructure
    ports:
      - "443:443"

    # NGINX only needs read access to the WordPress files
    volumes:
      - wordpress_data:/var/www/wordpress:ro

    networks:
      - inception


  redis:
    build:
      context: ./requirements/redis
    image: redis:bookworm
    container_name: redis
    restart: on-failure

    # Redis is only used internally by WordPress, so no host port is published
    networks:
      - inception


  ftp:
    build:
      context: ./requirements/ftp
    image: ftp:bookworm
    container_name: ftp
    restart: on-failure

    # Port 21 is the FTP control connection.
    # The additional range is used for passive-mode data connections.
    ports:
      - "21:21"
      - "21100-21110:21100-21110"

    secrets:
      - ftp_password

    # FTP exposes the same files used by the WordPress container
    volumes:
      - wordpress_data:/var/www/wordpress

    networks:
      - inception


# Private bridge network used for container-to-container communication
networks:
  inception:


# Named volumes whose backing directories are stored on the Docker host
volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/eulee/data/mariadb

  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/eulee/data/wordpress


# Sensitive values are read from files instead of being stored in images
secrets:
  db_password:
    file: ../secrets/db_password.txt

  wp_admin_password:
    file: ../secrets/wp_admin_password.txt

  wp_user_password:
    file: ../secrets/wp_user_password.txt

  ftp_password:
    file: ../secrets/ftp_password.txt
